name: Opdater træpillepriser

on:
  schedule:
    - cron: "15 5 * * *"   # ca. kl. 07:15 dansk sommertid (UTC+2). Bliver 08:15 dansk tid om vinteren.
  workflow_dispatch:        # giver en "Run workflow"-knap til manuel kørsel

permissions:
  contents: write

jobs:
  hent-priser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer afhængigheder
        run: npm install

      - name: Installer Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Hent priser fra pillemadsen.dk
        run: node hent-traepiller.js
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Commit og push opdaterede priser
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in traepriser.json historik.json tysk-markedsindeks.json \
                   ai-analyse.json drivere.json lager-historik.json \
                   tysk-produktion.json diesel-historik.json signaler.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet && echo "Ingen ændringer at gemme." && exit 0
          git commit -m "Opdater træpillepriser $(date -u +%Y-%m-%d)"
          # Hvis en anden kørsel har committet imens, hentes den ind først.
          # Uden dette afvises push som non-fast-forward.
          for forsoeg in 1 2 3; do
            if git push; then
              echo "Push lykkedes i forsøg $forsoeg."
              exit 0
            fi
            echo "Push afvist - henter nyeste ændringer og prøver igen..."
            git pull --rebase --autostash origin main || true
            sleep 5
          done
          echo "Kunne ikke pushe efter 3 forsøg." && exit 1
